<style>

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0b0a09}
body{background:#0b0a09;color:#f1efe6;overflow-x:hidden;-webkit-font-smoothing:antialiased;
 font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
#doc{position:relative}
.chap{position:relative}
@property --t{syntax:'<color>';inherits:true;initial-value:#0b0a09}
@property --b{syntax:'<color>';inherits:true;initial-value:#0b0a09}
@property --m{syntax:'<color>';inherits:true;initial-value:#0b0a09}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;contain:paint;
 background:linear-gradient(180deg,var(--t),var(--b));transition:--t 1.8s ease,--b 1.8s ease,--m 1.8s ease}
.stage.nt,.stage.cutbg{transition:none}
.eg{position:absolute;pointer-events:none}
.eg.t{left:-3px;right:-3px;top:-3px;height:190px;background:linear-gradient(180deg,var(--t) 0,color-mix(in srgb,var(--t) 70%,transparent) 22%,color-mix(in srgb,var(--t) 28%,transparent) 55%,transparent 100%)}
.eg.b{left:-3px;right:-3px;bottom:-3px;height:190px;background:linear-gradient(0deg,var(--b) 0,color-mix(in srgb,var(--b) 70%,transparent) 22%,color-mix(in srgb,var(--b) 28%,transparent) 55%,transparent 100%)}
.eg.l{left:-3px;top:0;bottom:0;width:190px;background:linear-gradient(90deg,var(--m) 0,color-mix(in srgb,var(--m) 70%,transparent) 22%,color-mix(in srgb,var(--m) 28%,transparent) 55%,transparent 100%)}
.eg.r{right:-3px;top:0;bottom:0;width:190px;background:linear-gradient(270deg,var(--m) 0,color-mix(in srgb,var(--m) 70%,transparent) 22%,color-mix(in srgb,var(--m) 28%,transparent) 55%,transparent 100%)}
.cut{transition:none!important}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
 transition:transform 2.8s cubic-bezier(.45,0,.18,1)}
.drift{position:absolute;inset:0}
.cv{position:absolute;inset:0}
.ly{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;
 --d:1.2s;--dt:1.6s;--dm:2s;--dl:0s;--e:cubic-bezier(.22,.7,.2,1);
 transition:opacity var(--d) var(--e) var(--dl),transform var(--dt) var(--e) var(--dl),
  -webkit-mask-position var(--dm) cubic-bezier(.5,.1,.25,1) var(--dl),mask-position var(--dm) cubic-bezier(.5,.1,.25,1) var(--dl)}
.ly.h{opacity:0}
.ly.rv{--d:.6s;--dt:.6s;--dm:.7s;--dl:0s!important}
.nt .ly,.nt .cam{transition:none!important}
.full{left:0;top:0;width:1920px;height:1080px}
/* reveal kinds: opacity + a few px of travel, never bouncy */
.k-soft.h{transform:translate3d(0,16px,0)}
.k-label{transform-origin:0 50%}.k-label.h{transform:translate3d(0,10px,0) scale(.96)}
.k-tab.h{transform:translate3d(0,22px,0)}
.k-note{transform-origin:50% 0}.k-note.h{transform:translate3d(0,-14px,0) rotate(-.8deg)}
.k-slide.h{transform:translate3d(30px,0,0)}
.k-fade{--d:2s;--e:cubic-bezier(.4,0,.2,1)}
.k-wipe{-webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 56%);mask-image:linear-gradient(90deg,#000 44%,transparent 56%);
 -webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
 -webkit-mask-position:0 0;mask-position:0 0;--d:.5s}
.k-wipe.h{-webkit-mask-position:100% 0;mask-position:100% 0}
.k-wipe.rv{--d:.4s}
/* whole-slide changes: slow dissolve with a hair of settle */
.sw{--d:1.8s;--dt:2.6s;--e:cubic-bezier(.4,0,.2,1);transform-origin:50% 50%}
.sw.h{transform:scale(1.018)}
.sw.rv{--d:.9s;--dt:.9s}
.fr{--d:1.5s;--e:cubic-bezier(.4,0,.2,1)}.fr.rv{--d:.7s}
/* intro */
.menu{--d:2.8s;--e:cubic-bezier(.4,0,.2,1)}
.ic{--d:2.2s;--e:cubic-bezier(.4,0,.2,1)}
.ic.out{opacity:0;--d:2s}
.chap.intro .cam{opacity:0;transition:opacity 2.6s ease .15s,transform 2.8s cubic-bezier(.45,0,.18,1)}
body.ready .chap.intro .cam{opacity:1}
/* interludes */
.inter{position:relative;overflow:hidden}
.inter .t{position:absolute;left:0;right:0;top:78%;transform:translateY(-50%);text-align:center;padding:0 24px;
 opacity:0;translate:0 18px;transition:opacity 1.6s cubic-bezier(.22,.7,.2,1),translate 1.9s cubic-bezier(.22,.7,.2,1)}
.inter.in .t{opacity:1;translate:0 0}
.inter .n{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.inter h2{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:400;font-size:clamp(22px,2.5vw,34px);
 letter-spacing:.01em;margin:14px 0 12px}
.inter p{font-size:11px;letter-spacing:.08em;opacity:.55;max-width:46ch;margin:0 auto;line-height:1.7}
.inter .ln{display:block;width:44px;height:1px;background:currentColor;opacity:.35;margin:20px auto 0;transform:scaleX(0);transition:transform 2.2s cubic-bezier(.22,.7,.2,1) .25s}
.inter.in .ln{transform:scaleX(1)}
.fin .t{top:50%}
.fin a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;opacity:.7;font-size:11px;letter-spacing:.18em;text-transform:uppercase;display:inline-block;margin-top:22px;padding-bottom:3px;cursor:pointer}
/* HUD */
.hud{position:fixed;z-index:20;pointer-events:none;color:#f1efe6;transition:color .8s ease}
.hud.light{color:#1d1a14}
.head{left:clamp(14px,2vw,30px);top:clamp(12px,2vh,22px);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;transition:opacity .45s ease,color .8s ease}
.head.away{opacity:0!important}
.head b{font-weight:700}
.head span{display:block;opacity:.55;letter-spacing:.06em;text-transform:none}
.bar{left:0;bottom:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:#ddff59;opacity:.9}
.rail{right:clamp(10px,1.4vw,22px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.rail i{display:block;width:5px;height:5px;border-radius:3px;background:currentColor;opacity:.25;transition:height .7s ease,opacity .7s ease,background .7s ease;position:relative;cursor:pointer}
.rail i::before{content:"";position:absolute;inset:-8px -10px}
.rail i.on{height:22px;opacity:.95;background:#ddff59;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.hud.light .rail i.on{background:#1d1a14;box-shadow:none}
.rail i::after{content:attr(data-t);position:absolute;right:16px;top:-4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:translateX(6px);transition:.3s;pointer-events:none}
.rail i:hover::after{opacity:.9;transform:none}
.end{left:clamp(14px,2vw,30px);bottom:clamp(12px,2vh,22px);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:0}
.cue{left:50%;bottom:clamp(16px,3.4vh,34px);transform:translateX(-50%);font-size:10px;letter-spacing:.26em;text-transform:uppercase;text-align:center;opacity:0;transition:opacity 1.4s ease}
.cue.on{opacity:.55}
.cue::after{content:"";display:block;width:1px;height:26px;margin:10px auto 0;background:currentColor;transform-origin:50% 0;animation:cue 2.6s cubic-bezier(.5,0,.2,1) infinite}
@keyframes cue{0%{transform:scaleY(0)}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@media (max-width:700px){.rail{display:none}.head span{display:none}}
@media (prefers-reduced-motion:reduce){.ly,.cam,.inter .t,.inter .ln{transition-duration:.01s!important}.cue::after{animation:none}}

/* in the portfolio frame only the bar along the bottom shows progress */
.rail{display:none!important}

   var cur=C.steps[i],nxt=C.steps[i+1],hold;
   if(cur.kind==='swap')hold=Q.swap;
   else hold=Q.base+Q.perRegion*Math.min(cur.kind==='frame'?cur.nr:cur.regions.length,Q.maxRegions);
   if(nxt&&nxt.kind==='swap')hold=Math.max(hold,Q.beforeSwap);
   if(i%7===0)hold+=Q.breath;
   acc+=hold;
  }
  C.travel=C.thr[C.thr.length-1]+Q.tail;
 });

 // ---------- interludes ----------
 function ease(t){return t*t*(3-2*t);}
 function grad(a,b){var s=[],N=10;for(var i=0;i<=N;i++){var t=i/N;s.push(mix(a,b,ease(t))+' '+(t*100).toFixed(1)+'%');}return 'linear-gradient(180deg,'+s.join(',')+')';}
 chaps.forEach(function(C){var f=C.steps[0],l=C.steps[C.steps.length-1];C.tc0=f.tc;C.bc1=l.bc;});
 var interludes=[];
 chaps.forEach(function(C,i){
  var nx=chaps[i+1];if(!nx)return;

  var a=C.bc1,b=nx.tc0;

  if(big){
   var L=LABEL[nx.id],t=el('div','t',s);
   t.style.color=lum(mix(a,b,ease(.8)))>140?'#1d1a14':'#f1efe6';
   el('div','n',t).textContent=L[0]+' / 06';
   el('h2','',t).textContent=L[1];

  }
  interludes.push(s);
 });
 var fin=el('section','inter fin',doc);
 var last=chaps[chaps.length-1];fin.style.background=grad(last.bc1,last.bc1);fin.dataset.h='.8';
 (function(){var t=el('div','t',fin);t.style.color=lum(last.bc1)>140?'#1d1a14':'#f1efe6';
  el('div','n',t).textContent='CIRCA';el('h2','',t).textContent='End of documentation';
  el('p','',t).textContent='Context · System · Research · Proposal · Blueprint · Flow';
  var a=el('a','',t);a.textContent='Back to the beginning';a.onclick=function(){scrollTo({top:0,behavior:reduce?'auto':'smooth'});};
 })();
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.3});
  interludes.concat([fin]).forEach(function(s){io.observe(s);});
 }else interludes.concat([fin]).forEach(function(s){s.classList.add('in');});

 // ---------- camera ----------
 function vis(z){return {w:W/(S0*z),h:H/(S0*z)};}
 function ctr(c){var v=vis(c.z);return {x:v.w>=1920?960:clamp(c.fx,v.w/2,1920-v.w/2),y:v.h>=1080?540:clamp(c.fy,v.h/2,1080-v.h/2)};}
 function contains(c,u,m){var v=vis(c.z),k=ctr(c);
  var x0=Math.max(0,k.x-v.w/2),x1=Math.min(1920,k.x+v.w/2),y0=Math.max(0,k.y-v.h/2),y1=Math.min(1080,k.y+v.h/2);
  return u[0]-m>=x0&&u[2]+m<=x1&&u[1]-m>=y0&&u[3]+m<=y1;}
 function frameFor(c,u,m,z){ // camera at zoom z that contains u, nearest to c
  var v=vis(z),cur=ctr(c),fx=960,fy=540;
  if(v.w<1920){var lo=Math.max(v.w/2,u[2]+m-v.w/2),hi=Math.min(1920-v.w/2,u[0]-m+v.w/2);if(lo>hi)return null;fx=clamp(cur.x,lo,hi);}
  if(v.h<1080){var lo2=Math.max(v.h/2,u[3]+m-v.h/2),hi2=Math.min(1080-v.h/2,u[1]-m+v.h/2);if(lo2>hi2)return null;fy=clamp(cur.y,lo2,hi2);}
  return {fx:fx,fy:fy,z:z};
 }
 function planCam(C){
  var cur={fx:960,fy:540,z:1},path=[cur],lastMove=-9,zmax=ZCH[C.id]||1;
  if(C.id==='intro'){
   for(var k=1;k<C.steps.length;k++)path.push(cur);
   C.camPath=path;return;
  }
  for(var i=1;i<C.steps.length;i++){
   var st=C.steps[i];
   if(st.kind==='frame'&&!st.u){path.push(cur);continue;}
   if(st.kind==='swap'){ // a new slide: settle back to the overview
    if(cur.z!==1||cur.fx!==960||cur.fy!==540){cur={fx:960,fy:540,z:1};lastMove=i;}
    path.push(cur);continue;
   }
   var u=st.u,m=40;
   if(contains(cur,u,m)){
    // calm proactive push-in: only for small content, only after a long rest, never on touch-sized stages
    var area=(u[2]-u[0])*(u[3]-u[1])/(1920*1080);
    if(cur.z===1&&zmax>1&&i-lastMove>=6&&area<.2&&S0>.4){var f=frameFor(cur,u,m+30,Math.min(ZOOM,zmax));if(f){cur=f;lastMove=i;}}
    path.push(cur);continue;
   }
   var f2=frameFor(cur,u,m,cur.z)||frameFor(cur,u,m,1)||{fx:(u[0]+u[2])/2,fy:(u[1]+u[3])/2,z:1};
   if(f2.z!==cur.z||f2.fx!==cur.fx||f2.fy!==cur.fy){cur=f2;lastMove=i;}
   path.push(cur);
  }
  C.camPath=path;
 }
 function place(C,c){
  var S=S0*c.z,cw=1920*S,ch=1080*S,tx=W/2-c.fx*S,ty=H/2-c.fy*S;
  tx=cw<=W?(W-cw)/2:clamp(tx,W-cw,0);ty=ch<=H?(H-ch)/2:clamp(ty,H-ch,0);
  C.cam.style.transform='translate3d('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px,0) scale('+S.toFixed(5)+')';
 }
 function layout(){
  U=innerHeight;W=chaps[0].stage.clientWidth;H=chaps[0].stage.clientHeight;
  S0=W/H>=1?Math.min(W/1920,H/1080):Math.max(W/1920,.46*H/1080);
  chaps.forEach(function(C){
   C.sec.style.height=((C.travel+100)/100*U)+'px';
   planCam(C);
   C.stage.classList.add('nt');place(C,C.camPath[Math.min(C.n-1,C.camPath.length-1)]);setBg(C,C.n-1);
  });
  interludes.concat([fin]).forEach(function(s){s.style.height=(parseFloat(s.dataset.h)*U)+'px';});
  void doc.offsetWidth;chaps.forEach(function(C){C.stage.classList.remove('nt');});
 }

 // ---------- states ----------
 function renderIntro(C,m){
  C.fr.forEach(function(e,k){e.classList.toggle('h',k!==m);});
 }
 function topSwap(C){for(var i=C.n-1;i>=0;i--)if(C.steps[i].kind==='swap'||C.steps[i].kind==='frame')return i;return 0;}
 function applyCull(C){
  var top=C.cover;
  C.steps.forEach(function(st,i){var d=i<top?'none':'';st.els.forEach(function(e){if(e.style.display!==d)e.style.display=d;});});
 }
 function scheduleCull(C){
  var t=topSwap(C);
  if(t<C.cover){C.cover=t;applyCull(C);}
  clearTimeout(C.ct);
  C.ct=setTimeout(function(){var t2=topSwap(C);if(t2!==C.cover){C.cover=t2;applyCull(C);}},2600);
 }
 function decoded(els){return Promise.all(els.map(function(e){
  var dec=function(){return e.decode?e.decode().catch(function(){}):Promise.resolve();};
  if(e.complete&&e.naturalWidth>1)return dec();
  return new Promise(function(res){e.addEventListener('load',function(){dec().then(res);},{once:true});setTimeout(res,7000);});
 }));}
 function setStep(C,i,on,delay){
  var st=C.steps[i];
  st.els.forEach(function(e,j){
   e.style.setProperty('--dl',on?((delay||0)+j*.18).toFixed(2)+'s':'0s');
   e.classList.toggle('rv',!on);e.classList.toggle('h',!on);
  });
 }
 function commit(C,n,instant){
  var old=C.n;C.n=n;
  if(instant)C.stage.classList.add('nt');
  if(C.id==='intro')renderIntro(C,n-1);
  else if(n>old){for(var i=old,k=0;i<n;i++,k++){
   if(instant)setStep(C,i,true,0);
   else (function(i,d){decoded(C.steps[i].els).then(function(){if(C.n>i)setStep(C,i,true,d);});})(i,Math.min(k,5)*.24);
  }}
  else for(var j=n;j<old;j++)setStep(C,j,false,0);
  place(C,C.camPath[Math.min(n-1,C.camPath.length-1)]);
  setBg(C,n-1);
  if(C.id!=='intro'){if(instant){C.cover=topSwap(C);applyCull(C);}else scheduleCull(C);}
  if(instant){void C.stage.offsetWidth;C.stage.classList.remove('nt');}
 }
 function setBg(C,i){
  var st=C.steps[Math.max(0,Math.min(i,C.steps.length-1))];if(!st||!st.tc)return;
  var s=C.stage.style;s.setProperty('--t',st.tc);s.setProperty('--b',st.bc);s.setProperty('--m',mix(st.tc,st.bc,.5));
 }
 function setLoaded(C,on){
  if(C.loaded===on)return;C.loaded=on;
  C.imgs.forEach(function(im){im.src=on?A+im.dataset.f+'?v='+V:BLANK;});
 }

 // ---------- hud ----------
 var hudChap=null,headT=0,hudLight=false;
 function setHud(C){
  if(hudChap===C)return;var first=hudChap===null;hudChap=C;
  var L=LABEL[C.id];
  var light=lum(mix(C.tc0,C.bc1,.5))>140;
  hud.forEach(function(h){h.classList.toggle('light',light);});
  clearTimeout(headT);
  var write=function(){head.innerHTML='<b>'+L[0]+' — '+L[1]+'</b><span>'+L[2]+'</span>';head.style.opacity=1;};
  if(first)write();else{head.style.opacity=0;headT=setTimeout(write,420);}
  var r=rail.children;for(var k=0;k<r.length;k++)r[k].classList.toggle('on',k===C.nav);
 }
 NAVT.forEach(function(t,k){var i=el('i','',rail);i.setAttribute('data-t',t);
  i.onclick=function(){for(var c=0;c<chaps.length;c++)if(chaps[c].nav===k){
   var y=chaps[c].sec.getBoundingClientRect().top+scrollY;scrollTo({top:y,behavior:reduce?'auto':'smooth'});return;}};});

 // ---------- tick ----------
 var raf=0,dRaf=0;
 function schedule(){if(!raf)raf=requestAnimationFrame(tick);}
 function tick(){
  raf=0;
  var vh=U,active=chaps[0],pad=0;
  for(var i=0;i<chaps.length;i++){
   var C=chaps[i],r=C.sec.getBoundingClientRect();
   var near=r.top<vh*2.4&&r.bottom>-vh*1.4,far=r.top>vh*7||r.bottom<-vh*6;
   if(near)setLoaded(C,true);else if(far)setLoaded(C,false);
   if(r.top<=vh*.55)active=C;
   var target;
   if(r.top>=vh){target=1;}
   else if(r.bottom<=0){target=C.steps.length;}
   else{
    var sc=-r.top/vh*100,n=C.n;
    while(n<C.steps.length&&sc>=C.thr[n])n++;
    while(n>1&&sc<C.thr[n-1]-4)n--;
    target=n;
    if(n!==C.n)commit(C,n,false);
    continue;
   }
   if(target!==C.n)commit(C,target,true);
  }
  var away=false;for(var q=0;q<interludes.length;q++){var tt=interludes[q].firstChild;if(tt&&tt.className==='t'){var tr=tt.getBoundingClientRect();if(tr.bottom>-10&&tr.top<110)away=true;}}
  head.classList.toggle('away',away);
  setHud(active);
  var st=active.steps[Math.min(active.n,active.steps.length)-1];
  var total=document.documentElement.scrollHeight-vh,y=scrollY;
  bar.style.transform='scaleX('+clamp(y/Math.max(1,total)).toFixed(4)+')';
  endEl.style.opacity=clamp((y-(total-vh*.9))/(vh*.4)).toFixed(3);
  cue.classList.toggle('on',y<30&&document.body.classList.contains('ready'));
 }
 function driftLoop(){
  dRaf=0;var moving=false;
  chaps.forEach(function(C){
   var d=C.drift,t=C.dTarget;
   if(Math.abs(t-d)>.02){d+=(t-d)*.07;C.drift=d;C.dEl.style.transform='translate3d(0,'+d.toFixed(2)+'px,0)';moving=true;}
  });
  if(moving)dRaf=requestAnimationFrame(driftLoop);
 }
 addEventListener('scroll',schedule,{passive:true});
 addEventListener('resize',function(){layout();schedule();});

 layout();
 var c0=chaps[0];c0.fr.forEach(function(e){e.addEventListener('load',function(){if(e.decode)e.decode().catch(function(){});});});setLoaded(c0,true);

 var f0=c0.fr[0];if(f0.complete&&f0.naturalWidth>1)ready();else{f0.addEventListener('load',function(){setTimeout(ready,250);});setTimeout(ready,4000);}
 schedule();
 window.__circa={chaps:chaps,P:P,commit:commit,layout:layout};
